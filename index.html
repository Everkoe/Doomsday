<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0F" />
    <meta name="description" content="Tu maratón personal del Universo Cinematográfico de Marvel rumbo a Avengers: Doomsday." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Michroma&display=swap"
      rel="stylesheet"
    />
    <title>Marvel — El camino a Doomsday</title>
    <!-- Intro: va en línea para pintarse antes de que cargue React -->
    <style>
      @property --doom-radio {
        syntax: '<length>';
        inherits: true;
        initial-value: 0px;
      }
      .doom-intro[hidden] { display: none; }
      .doom-intro {
        --doom-centro: 46%;
        --doom-verde: #3ddc84;
        --doom-verde-hondo: #0f7a45;
        --doom-ease: cubic-bezier(.22, 1, .36, 1);
        position: fixed;
        inset: 0;
        z-index: 10000;
        isolation: isolate;
        overflow: hidden;
        color: #f5f5f7;
        font-family: 'Inter', system-ui, sans-serif;
        background:
          radial-gradient(ellipse 34rem 26rem at 50% var(--doom-centro), rgba(61, 220, 132, .16), transparent 72%),
          radial-gradient(ellipse 60rem 30rem at 50% 110%, rgba(230, 36, 41, .10), transparent 70%),
          linear-gradient(160deg, #0b0f0d, #080a0f 60%, #0a120e);
      }
      .doom-intro__estado {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap;
      }
      .doom-intro__marca {
        position: absolute; left: 50%; top: var(--doom-centro);
        translate: -50% -50%;
        width: clamp(18rem, 56vmin, 24rem);
        aspect-ratio: 1;
        display: grid; place-items: center;
      }
      /* Resplandor místico */
      .doom-intro__marca::before {
        content: ''; position: absolute; inset: -18%;
        background: radial-gradient(circle, rgba(61, 220, 132, .30), rgba(15, 122, 69, .10) 45%, transparent 68%);
        opacity: 0;
        animation: doom-luz 1.4s var(--doom-ease) .1s both;
      }
      /* Círculos de runas */
      .doom-intro__runas {
        position: absolute; inset: 0; opacity: 0;
        animation: doom-runas-entrar 1.1s var(--doom-ease) .05s both;
      }
      /* Cada anillo es una capa propia que gira entera: la rota la GPU sin volver a pintar el SVG. */
      .doom-intro__capa {
        position: absolute; inset: 0; will-change: transform;
        animation: doom-girar 14s linear infinite;
      }
      .doom-intro__capa--inversa { animation-direction: reverse; animation-duration: 10s; }
      .doom-intro__capa--exterior { animation-direction: reverse; animation-duration: 22s; }
      .doom-intro__capa svg {
        width: 100%; height: 100%; overflow: visible;
        filter: drop-shadow(0 0 6px rgba(61, 220, 132, .7));
      }
      .doom-intro__runas text {
        fill: var(--doom-verde); font-size: 6.2px; letter-spacing: 2.1px;
        font-family: 'Segoe UI Symbol', 'Noto Sans Runic', serif;
      }
      .doom-intro__runas circle { fill: none; stroke: var(--doom-verde); }
      .doom-intro__runas text { white-space: pre; }
      .doom-intro__runas .doom-intro__runas-ext { font-size: 5.4px; letter-spacing: 1.9px; opacity: .8; }
      /* Runas que se encienden una a una (los <tspan> los crea el script) */
      .doom-intro__runas tspan { animation: doom-runa .5s ease-out both; }
      /* Sellos de invocación */
      .doom-intro__sello circle { fill: #07120c; stroke-width: .7; transition: fill .25s ease; }
      .doom-intro__runas .doom-intro__sello text {
        font-size: 4.2px; letter-spacing: 0; text-anchor: middle; dominant-baseline: central;
        opacity: 0; animation: doom-texto .5s var(--doom-ease) 1.05s both;
      }
      .doom-intro__sello { opacity: 0; animation: doom-sello .6s var(--doom-ease) both; }
      .doom-intro__sello:nth-of-type(1) { animation-delay: .55s; }
      .doom-intro__sello:nth-of-type(2) { animation-delay: .65s; }
      .doom-intro__sello:nth-of-type(3) { animation-delay: .75s; }
      .doom-intro__sello:nth-of-type(4) { animation-delay: .85s; }
      .doom-intro__sello:nth-of-type(5) { animation-delay: .95s; }
      .doom-intro__sello:nth-of-type(6) { animation-delay: 1.05s; }

      /* Carga: el poder de Doom se concentra justo antes del portal */
      .doom-intro--cargando .doom-intro__runas { animation: doom-cargar .7s ease-in-out forwards; }
      .doom-intro--cargando .doom-intro__marca::before { animation: doom-luz-carga .7s ease-in-out forwards; }
      .doom-intro--cargando .doom-intro__sello circle { fill: var(--doom-verde); }
      .doom-intro--cargando .doom-intro__sello text { fill: #07120c; }
      .doom-intro--cargando .doom-intro__titulo span { animation: doom-titulo-carga .7s ease-in-out forwards; }
      /* Ondas de energía */
      .doom-intro__onda {
        position: absolute; inset: 18%;
        border-radius: 50%;
        border: 1.5px solid rgba(61, 220, 132, .55);
        box-shadow: 0 0 18px rgba(61, 220, 132, .35), inset 0 0 18px rgba(61, 220, 132, .2);
        opacity: 0;
        animation: doom-onda 1.7s cubic-bezier(.16, .65, .38, 1) .35s forwards;
      }
      .doom-intro__onda--roja { border-color: rgba(230, 36, 41, .45); box-shadow: 0 0 18px rgba(230, 36, 41, .3); animation-delay: .7s; }
      /* Firma */
      .doom-intro__firma { position: relative; display: grid; justify-items: center; gap: .55rem; text-align: center; }
      /* DOOMSDAY: letras anchas en verde metálico, con un único reflejo al aparecer */
      .doom-intro__titulo {
        position: relative; margin: 0; padding-bottom: .55rem; white-space: nowrap;
        font: 400 clamp(1.2rem, 3.9vmin, 1.8rem)/1 'Michroma', 'Oswald', sans-serif;
        letter-spacing: .14em; margin-right: -.14em; text-transform: uppercase;
        animation: doom-logo .9s var(--doom-ease) .15s both;
      }
      .doom-intro__titulo span {
        display: inline-block;
        background:
          linear-gradient(105deg, transparent 42%, rgba(255, 255, 255, .9) 50%, transparent 58%) 130% 0 / 260% 100% no-repeat,
          linear-gradient(180deg, #c9ffe0 0%, #3ddc84 42%, #13894d 70%, #0b4f2d 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
        -webkit-text-stroke: .5px rgba(201, 255, 224, .35);
        filter: drop-shadow(0 0 10px rgba(61, 220, 132, .55)) drop-shadow(0 2px 0 #04140b);
        animation: doom-reflejo-titulo 1s ease-in-out .85s both;
      }
      /* Línea bajo el título */
      .doom-intro__titulo::after {
        content: ''; position: absolute; left: 4%; right: calc(4% + .14em); bottom: 0; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(61, 220, 132, .9) 20%, #c9ffe0 50%, rgba(61, 220, 132, .9) 80%, transparent);
        box-shadow: 0 0 10px rgba(61, 220, 132, .7);
        transform-origin: center; animation: doom-linea .8s var(--doom-ease) .55s both;
      }
      .doom-intro__cuenta {
        margin: 0; color: #a7adbb;
        font-size: .66rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
        animation: doom-texto .7s var(--doom-ease) .55s both;
      }
      /* Barra de energía */
      .doom-intro__pulso {
        position: absolute; left: 50%; bottom: max(9%, 1.5rem); translate: -50%;
        width: clamp(6rem, 14vw, 9rem); height: 2px; border-radius: 99px; overflow: hidden;
        background: rgba(61, 220, 132, .14);
      }
      .doom-intro__pulso::after {
        content: ''; display: block; width: 60%; height: 100%;
        background: linear-gradient(90deg, transparent, var(--doom-verde-hondo) 30%, var(--doom-verde) 60%, transparent);
        animation: doom-pulso 1.3s ease-in-out infinite;
      }
      /* Salida: portal que se abre desde el centro */
      .doom-intro--saliendo { animation: doom-desvanecer .6s ease both; }
      .doom-intro--portal.doom-intro--saliendo {
        -webkit-mask-image: radial-gradient(circle at 50% var(--doom-centro), transparent var(--doom-radio), #000 calc(var(--doom-radio) + 2px));
        mask-image: radial-gradient(circle at 50% var(--doom-centro), transparent var(--doom-radio), #000 calc(var(--doom-radio) + 2px));
        animation: doom-abrir 1.1s cubic-bezier(.45, 0, .2, 1) both;
      }
      .doom-intro__borde {
        position: absolute; left: 50%; top: var(--doom-centro);
        width: calc(var(--doom-radio) * 2); aspect-ratio: 1; translate: -50% -50%;
        border-radius: 50%; pointer-events: none; opacity: 0;
        box-shadow: 0 0 0 1.5px rgba(61, 220, 132, .7), 0 0 22px 4px rgba(61, 220, 132, .35), inset 0 0 22px 4px rgba(61, 220, 132, .2);
      }
      .doom-intro--portal.doom-intro--saliendo .doom-intro__borde { opacity: 1; }
      .doom-intro--saliendo .doom-intro__marca { animation: doom-retirar .8s cubic-bezier(.3, 0, .2, 1) both; }

      @keyframes doom-luz { from { opacity: 0; scale: .7; } to { opacity: 1; scale: 1; } }
      @keyframes doom-runas-entrar { from { opacity: 0; scale: .6; rotate: -40deg; } to { opacity: .85; scale: 1; rotate: 0deg; } }
      @keyframes doom-girar { to { transform: rotate(360deg); } }
      @keyframes doom-onda { 0% { opacity: .8; transform: scale(.7); } 100% { opacity: 0; transform: scale(2.4); } }
      @keyframes doom-logo {
        from { opacity: 0; clip-path: inset(0 0 100% 0); transform: translateY(10px) scale(.9); }
        to { opacity: 1; clip-path: inset(0); transform: none; }
      }
      @keyframes doom-reflejo-titulo { from { background-position: 130% 0, 0 0; } to { background-position: -30% 0, 0 0; } }
      @keyframes doom-linea { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: scaleX(1); } }
      @keyframes doom-texto { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes doom-pulso { from { transform: translateX(-110%); } to { transform: translateX(175%); } }
      @keyframes doom-desvanecer { to { opacity: 0; } }
      @keyframes doom-abrir {
        0% { --doom-radio: 0px; }
        80% { opacity: 1; }
        100% { --doom-radio: 150vmax; opacity: 0; }
      }
      /* El círculo se hunde hacia el fondo mientras el portal se abre (acorde con el sonido grave) */
      @keyframes doom-retirar {
        0% { scale: 1; }
        25% { scale: .95; filter: brightness(1.5); }
        100% { opacity: 0; scale: .72; filter: blur(5px) brightness(.6); }
      }
      @keyframes doom-runa {
        0% { fill-opacity: 0; }
        35% { fill-opacity: 1; fill: #f2fff7; }
        100% { fill-opacity: 1; fill: var(--doom-verde); }
      }
      @keyframes doom-sello { 0% { opacity: 0; } 50% { opacity: 1; filter: brightness(2.5); } 100% { opacity: 1; filter: none; } }
      /* Carga: el círculo "inhala" (se contrae y se oscurece) antes del golpe grave */
      @keyframes doom-cargar {
        0% { opacity: .85; scale: 1; rotate: 0deg; }
        100% { opacity: 1; scale: .94; rotate: 25deg; }
      }
      @keyframes doom-luz-carga {
        from { opacity: 1; scale: 1; }
        to { opacity: .55; scale: .82; }
      }
      @keyframes doom-titulo-carga {
        to { filter: brightness(.8) drop-shadow(0 0 6px rgba(61, 220, 132, .4)) drop-shadow(0 2px 0 #04140b); }
      }
      @media (prefers-reduced-motion: reduce) { .doom-intro { display: none; } }
    </style>
  </head>
  <body>
    <div id="doom-intro" class="doom-intro" role="status" hidden>
      <span class="doom-intro__estado">Cargando El camino a Doomsday</span>
      <div class="doom-intro__marca" aria-hidden="true">
        <div class="doom-intro__runas">
          <!-- Anillo exterior: gira al revés, con sellos de invocación -->
          <div class="doom-intro__capa doom-intro__capa--exterior">
            <svg viewBox="0 0 120 120">
              <defs><path id="doom-ruta-exterior" d="M60,60 m-63,0 a63,63 0 1,1 126,0 a63,63 0 1,1 -126,0" /></defs>
                <circle cx="60" cy="60" r="68.5" stroke-width=".45" opacity=".5" />
                <text class="doom-intro__runas-ext"><textPath href="#doom-ruta-exterior" data-encender>ᛟᛞᛜᛚ ᛗᛖᛒᛏ ᛊᛉᛈᛇ ᛃᛁᚾᚺ ᚹᚷᚲᚱ ᚨᚦᚢᚠ ᛟᛞᛜᛚ ᛗᛖᛒᛏ ᛊᛉᛈᛇ ᛃᛁᚾᚺ ᚹᚷᚲᚱ ᚨᚦᚢᚠ ᛟᛞᛜᛚ ᛗᛖᛒᛏ ᛊᛉᛈᛇ</textPath></text>
                <circle cx="60" cy="60" r="59" stroke-width=".35" stroke-dasharray=".6 2.4" opacity=".7" />
                <g class="doom-intro__sello"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᛟ</text></g>
                <g class="doom-intro__sello" transform="rotate(60 60 60)"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᛞ</text></g>
                <g class="doom-intro__sello" transform="rotate(120 60 60)"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᛉ</text></g>
                <g class="doom-intro__sello" transform="rotate(180 60 60)"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᛗ</text></g>
                <g class="doom-intro__sello" transform="rotate(240 60 60)"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᛇ</text></g>
                <g class="doom-intro__sello" transform="rotate(300 60 60)"><circle cx="60" cy="-8.5" r="3.6" /><text x="60" y="-8.5">ᚦ</text></g>
            </svg>
          </div>
          <div class="doom-intro__capa">
            <svg viewBox="0 0 120 120">
              <defs><path id="doom-ruta-runas" d="M60,60 m-50,0 a50,50 0 1,1 100,0 a50,50 0 1,1 -100,0" /></defs>
                <circle cx="60" cy="60" r="56" stroke-width=".5" opacity=".55" />
                <text><textPath href="#doom-ruta-runas" data-encender>ᚠᚢᚦᚨᚱᚲᚷᚹ ᚺᚾᛁᛃᛇᛈ ᛉᛊᛏᛒᛖᛗ ᛚᛜᛞᛟ ᚠᚢᚦᚨᚱᚲᚷᚹ ᚺᚾᛁᛃᛇᛈ ᛉᛊᛏᛒᛖᛗ</textPath></text>
                <circle cx="60" cy="60" r="45" stroke-width=".6" stroke-dasharray="1 3" opacity=".8" />
            </svg>
          </div>
          <div class="doom-intro__capa doom-intro__capa--inversa">
            <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="40" stroke-width=".4" stroke-dasharray="14 4 2 4" opacity=".6" />
            </svg>
          </div>
        </div>
        <span class="doom-intro__onda"></span>
        <span class="doom-intro__onda doom-intro__onda--roja"></span>
        <div class="doom-intro__firma">
          <p class="doom-intro__titulo"><span>Doomsday</span></p>
          <p class="doom-intro__cuenta" id="doom-intro-cuenta"></p>
        </div>
      </div>
      <span class="doom-intro__borde" aria-hidden="true"></span>
      <span class="doom-intro__pulso" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const intro = document.getElementById('doom-intro');
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          intro.remove();
          return;
        }
        // Solo una vez por sesión del navegador (añade ?intro a la URL para verla de nuevo).
        const clave = 'road-to-doomsday:intro:v1';
        const forzar = new URLSearchParams(location.search).has('intro');
        try {
          if (!forzar && sessionStorage.getItem(clave)) {
            intro.remove();
            return;
          }
          sessionStorage.setItem(clave, '1');
        } catch {
          // Si el almacenamiento está bloqueado, la intro se muestra igualmente.
        }

        const ESTRENO = new Date('2026-12-18T00:00:00');
        const dias = Math.ceil((ESTRENO.getTime() - Date.now()) / 86400000);
        document.getElementById('doom-intro-cuenta').textContent =
          dias > 1 ? `Faltan ${dias} días` : dias === 1 ? 'Mañana en cines' : 'Ya en cines';

        // Las runas se encienden una a una: cada carácter pasa a ser un <tspan> con su retardo.
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const RETARDO_RUNA_MS = 12;
        document.querySelectorAll('#doom-intro [data-encender]').forEach((ruta, anillo) => {
          const runas = Array.from(ruta.textContent);
          ruta.textContent = '';
          runas.forEach((runa, i) => {
            const tspan = document.createElementNS(SVG_NS, 'tspan');
            tspan.textContent = runa;
            tspan.style.animationDelay = `${350 + anillo * 120 + i * RETARDO_RUNA_MS}ms`;
            ruta.appendChild(tspan);
          });
        });

        const MINIMO_MS = 1900;
        const MAXIMO_MS = 3000;
        const CARGA_MS = 700;
        const sonido = crearSonidoDoom();
        const app = document.getElementById('root');
        const inicio = performance.now();
        intro.classList.toggle(
          'doom-intro--portal',
          typeof window.CSS?.registerProperty === 'function' &&
            (CSS.supports('mask-image', 'radial-gradient(#000, transparent)') ||
              CSS.supports('-webkit-mask-image', 'radial-gradient(#000, transparent)')),
        );
        intro.hidden = false;
        app.setAttribute('inert', '');
        const limite = setTimeout(salir, MAXIMO_MS);
        document.addEventListener('doomsday:lista', lista, { once: true });

        // Intenta sonar ya; si el navegador lo bloquea, arranca con el primer toque o tecla durante la intro.
        sonido?.intentar();
        const desbloquear = () => sonido?.intentar();
        ['pointerdown', 'keydown', 'touchstart'].forEach((tipo) =>
          window.addEventListener(tipo, desbloquear, { capture: true, passive: true }),
        );

        function lista() {
          clearTimeout(limite);
          setTimeout(salir, Math.max(0, MINIMO_MS - (performance.now() - inicio)));
        }

        // Primero el círculo se contrae y se oscurece; con el golpe grave se hunde y se abre el portal.
        function salir() {
          document.removeEventListener('doomsday:lista', lista);
          intro.classList.add('doom-intro--cargando');
          sonido?.cargar(CARGA_MS / 1000);
          setTimeout(abrirPortal, CARGA_MS);
        }

        function abrirPortal() {
          intro.classList.add('doom-intro--saliendo');
          sonido?.estallar();
          const terminar = () => {
            clearTimeout(respaldo);
            ['pointerdown', 'keydown', 'touchstart'].forEach((tipo) =>
              window.removeEventListener(tipo, desbloquear, { capture: true }),
            );
            sonido?.cerrar();
            app.removeAttribute('inert');
            intro.remove();
          };
          const respaldo = setTimeout(terminar, 1200);
          intro.addEventListener('animationend', (e) => {
            if (e.target === intro) terminar();
          });
        }

        /**
         * Sonido corto de entrada (mismo que el de la app al confirmar): dos notas muy graves en quinta,
         * sintetizadas con Web Audio. Suena al abrirse el portal si el navegador ya permite audio
         * (o si se ha tocado/pulsado algo durante la intro); si no, la intro sigue en silencio.
         */
        function crearSonidoDoom() {
          const Contexto = window.AudioContext || window.webkitAudioContext;
          if (!Contexto) return null;
          let ctx;
          try {
            ctx = new Contexto();
          } catch {
            return null;
          }
          // "Abismo": dos notas muy graves en quinta (La2 → Mi3).
          const NOTAS = [
            { frecuencia: 110, retraso: 0, duracion: 0.34, volumen: 0.12 },
            { frecuencia: 164.81, retraso: 0.12, duracion: 0.42, volumen: 0.1 },
          ];
          let terminado = false;

          function intentar() {
            if (terminado || ctx.state === 'running') return;
            ctx.resume().catch(() => {});
          }

          function estallar() {
            if (terminado || ctx.state !== 'running') return;
            const inicio = ctx.currentTime + 0.02;
            NOTAS.forEach(({ frecuencia, retraso, duracion, volumen }) => {
              const comienzo = inicio + retraso;
              const fin = comienzo + duracion;
              [['sine', 1, 1], ['triangle', 0.5, 0.45]].forEach(([tipo, multiplo, peso]) => {
                const osc = ctx.createOscillator();
                const nivel = ctx.createGain();
                osc.type = tipo;
                osc.frequency.value = frecuencia * multiplo;
                nivel.gain.setValueAtTime(0, comienzo);
                nivel.gain.linearRampToValueAtTime(volumen * peso, comienzo + 0.015);
                nivel.gain.exponentialRampToValueAtTime(0.0001, fin);
                osc.connect(nivel).connect(ctx.destination);
                osc.start(comienzo);
                osc.stop(fin + 0.02);
              });
            });
          }

          function cerrar() {
            terminado = true;
            setTimeout(() => ctx.close().catch(() => {}), 1100);
          }

          return { intentar, cargar() {}, estallar, cerrar };
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
